<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>حصالة — تسجيل الدخول</title>
<link rel="icon" type="image/png" href="/static/icon.png">
<link rel="apple-touch-icon" href="/static/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@600;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN SYSTEM — مطابق للصفحة الرئيسية
═══════════════════════════════════════════════════════════ */
:root {
  --teal:        #0ec9b0;
  --teal-2:      #07a08c;
  --teal-glow:   rgba(14,201,176,.18);
  --teal-glass:  rgba(14,201,176,.08);
  --wood:        #c8956c;
  --wood-2:      #a97040;
  --wood-glass:  rgba(200,149,108,.10);
  --red:         #ff5c6b;
  --red-glass:   rgba(255,92,107,.10);
  --gold:        #f0b429;
  --blue:        #4fa3e0;
  --bg:          #08111e;
  --bg-mid:      #0c1929;
  --glass-1:     rgba(255,255,255,.045);
  --glass-2:     rgba(255,255,255,.07);
  --glass-border:rgba(255,255,255,.08);
  --glass-teal:  rgba(14,201,176,.06);
  --t1: #e8f4f2;
  --t2: #7a9998;
  --t3: #3d5c5a;
  --r: 18px; --rs: 12px;
  --blur: blur(22px);
  --shadow: 0 8px 40px rgba(0,0,0,.45);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--t1);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 1.5s ease;
}

/* ═══ WEATHER THEME ═══ */
#weatherBg {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; display: none; overflow: hidden;
}
body.theme-weather #weatherBg { display: block }
body.theme-weather { background: transparent }
body.theme-weather::before,
body.theme-weather::after { display: none }

#wSky {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,#0a0e1a 0%,#0c1929 100%);
  transition: background 2s ease;
}
#wSun {
  position: absolute; width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle,#fffbe6 0%,#ffd94a 40%,rgba(255,180,0,.3) 70%,transparent 100%);
  box-shadow: 0 0 60px 30px rgba(255,200,0,.35),0 0 120px 60px rgba(255,160,0,.15);
  top:12%; left:50%; transform:translateX(-50%); transition:opacity 1.5s;
}
#wSun::before {
  content:''; position:absolute; inset:-20px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,220,80,.12) 0%,transparent 70%);
  animation:sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.15);opacity:1} }
#wRays {
  position:absolute; width:200px; height:200px;
  top:calc(12% - 55px); left:50%; transform:translateX(-50%);
  animation:rotateSlow 25s linear infinite;
}
#wRays span {
  position:absolute; top:50%; left:50%;
  width:80px; height:2px;
  background:linear-gradient(90deg,rgba(255,210,50,.5),transparent);
  transform-origin:0 50%; border-radius:2px;
}
@keyframes rotateSlow { to { transform:translateX(-50%) rotate(360deg) } }
#wMoon {
  position:absolute; width:70px; height:70px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f5f0d0,#d4cfa0);
  box-shadow:0 0 40px 15px rgba(200,195,140,.2),inset -8px -4px 0 rgba(0,0,0,.1);
  top:10%; left:50%; transform:translateX(-50%); transition:opacity 1.5s;
}
#wStars { position:absolute; inset:0 }
.wStar {
  position:absolute; border-radius:50%; background:#fff;
  animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);
}
@keyframes twinkle { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }
#wClouds { position:absolute; width:100%; top:0 }
.wCloud {
  position:absolute; border-radius:60px;
  background:var(--cloud-color,rgba(255,255,255,.08));
  filter:blur(12px);
  animation:driftCloud var(--dur,60s) linear infinite var(--delay,0s);
}
@keyframes driftCloud { from{transform:translateX(-200px)} to{transform:translateX(calc(100vw + 200px))} }
#wRain { position:absolute; inset:0; overflow:hidden }
.wDrop {
  position:absolute; width:1.5px;
  background:linear-gradient(180deg,transparent,rgba(140,200,255,.6));
  border-radius:2px;
  animation:fall var(--dur,.8s) linear infinite var(--delay,0s);
}
@keyframes fall { from{transform:translateY(-50px)} to{transform:translateY(100vh)} }
#wLightning { position:fixed; inset:0; z-index:2; pointer-events:none }
.lightning-flash { animation:flash .15s ease-out }
@keyframes flash { 0%{background:rgba(200,220,255,.0)} 50%{background:rgba(200,220,255,.25)} 100%{background:rgba(200,220,255,.0)} }

/* ── Weather text contrast ── */
body[data-wx="day-clear"] .greeting h1,
body[data-wx="day-clear"] .greeting p,
body[data-wx="day-clear"] .login-card h2,
body[data-wx="day-clear"] .field label,
body[data-wx="day-clear"] .preview-title,
body[data-wx="day-clear"] .bank-mini-name,
body[data-wx="day-clear"] .last-tx-label,
body[data-wx="day-clear"] .last-tx-date {
  text-shadow: 0 1px 10px rgba(0,20,60,.7), 0 0 30px rgba(0,10,40,.4);
}
body[data-wx="day-clear"] .bank-mini-bal,
body[data-wx="day-clear"] .last-tx-amount,
body[data-wx="day-clear"] .last-tx-name {
  text-shadow: 0 2px 12px rgba(0,30,80,.6);
}
body[data-wx="day-cloud"] .greeting h1,
body[data-wx="day-cloud"] .login-card h2,
body[data-wx="day-cloud"] .preview-title {
  text-shadow: 0 1px 8px rgba(0,0,0,.5);
}
body[data-wx="night"] .greeting h1,
body[data-wx="night"] .login-card h2 {
  text-shadow: 0 1px 6px rgba(0,0,0,.4);
}
body.theme-weather * {
  transition: color .6s ease, text-shadow .6s ease,
              background-color .6s ease, border-color .4s ease !important;
}
body.theme-weather .wStar,
body.theme-weather .wCloud,
body.theme-weather .wDrop,
body.theme-weather #wRays,
body.theme-weather #wSun,
body.theme-weather #wMoon { transition: opacity 1.5s ease !important }

/* Ambient orbs (default theme) */
body::before {
  content:''; position:fixed; top:-20%; right:-10%;
  width:80vw; height:80vw;
  background:radial-gradient(circle,rgba(14,201,176,.04) 0%,transparent 65%);
  pointer-events:none; z-index:0;
}
body::after {
  content:''; position:fixed; bottom:-20%; left:-10%;
  width:60vw; height:60vw;
  background:radial-gradient(circle,rgba(200,149,108,.04) 0%,transparent 65%);
  pointer-events:none; z-index:0;
}

/* ═══ LAYOUT ═══ */
.page {
  position:relative; z-index:1;
  width:100%; min-height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:24px 16px;
  gap:24px;
}

/* ═══ GREETING ═══ */
.greeting {
  text-align:center;
}
.greeting-icon {
  width:72px; height:72px;
  background:linear-gradient(135deg,var(--teal),var(--teal-2));
  border-radius:22px;
  display:flex; align-items:center; justify-content:center;
  font-size:32px;
  box-shadow:0 6px 30px var(--teal-glow);
  margin:0 auto 16px;
  animation:floatIcon 3s ease-in-out infinite;
}
@keyframes floatIcon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.greeting h1 {
  font-family:'Cairo'; font-size:2rem; font-weight:900;
  background:linear-gradient(135deg,var(--teal),var(--wood));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.greeting p {
  font-size:.85rem; color:var(--t2);
}

/* ═══ LOGIN CARD ═══ */
.login-card {
  width:100%; max-width:400px;
  background:var(--glass-1);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:28px 28px 24px;
}
.login-card h2 {
  font-family:'Cairo'; font-size:1.1rem; font-weight:700;
  color:var(--t1); margin-bottom:20px; text-align:center;
}

.field { margin-bottom:16px }
.field label {
  display:block; font-size:.78rem; font-weight:700;
  color:var(--t2); margin-bottom:6px; letter-spacing:.3px;
}
.field input {
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid var(--glass-border);
  border-radius:10px;
  color:var(--t1);
  font-family:'Tajawal'; font-size:.95rem;
  padding:10px 14px;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
  direction:ltr; text-align:left;
}
.field input:focus {
  border-color:rgba(14,201,176,.5);
  box-shadow:0 0 0 3px rgba(14,201,176,.08);
}

.login-btn {
  width:100%; padding:12px;
  background:linear-gradient(135deg,var(--teal),var(--teal-2));
  color:#001a17; font-family:'Tajawal'; font-weight:800;
  font-size:1rem; border:none; border-radius:12px;
  cursor:pointer; transition:all .2s;
  box-shadow:0 4px 20px var(--teal-glow);
  margin-top:4px;
}
.login-btn:hover { transform:translateY(-2px); box-shadow:0 6px 28px var(--teal-glow) }
.login-btn:active { transform:translateY(0) }

/* Google Sign-In button */
.google-btn {
  width:100%; padding:12px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:#ffffff; color:#1f1f1f;
  font-family:'Tajawal'; font-weight:800; font-size:1rem;
  border:none; border-radius:12px;
  cursor:pointer; transition:all .2s;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  margin-top:4px;
}
.google-btn:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(0,0,0,.45) }
.google-btn:active { transform:translateY(0) }
.google-btn:disabled { opacity:.6; cursor:default; transform:none }
.google-btn svg { flex-shrink:0 }

.login-error {
  margin-top:10px; padding:8px 14px;
  background:var(--red-glass); border:1px solid rgba(255,92,107,.2);
  border-radius:8px; font-size:.82rem; color:var(--red);
  display:none; text-align:center;
}

/* Theme toggle inside card */
.theme-row {
  display:flex; justify-content:center; margin-top:16px;
}
#loginThemeBtn {
  display:flex; align-items:center; gap:6px;
  padding:6px 14px;
  border:1px solid var(--glass-border);
  background:var(--glass-1);
  color:var(--t2); border-radius:10px; cursor:pointer;
  font-family:'Tajawal'; font-size:.78rem; font-weight:700;
  transition:all .3s;
}
#loginThemeBtn:hover { border-color:rgba(14,201,176,.3); color:var(--teal) }

/* ═══ PREVIEW CARDS ═══ */
.preview-section {
  width:100%; max-width:560px;
  display:flex; flex-direction:column; gap:14px;
}
.preview-title {
  font-size:.72rem; font-weight:700; color:var(--t3);
  letter-spacing:.6px; text-transform:uppercase;
  text-align:center; margin-bottom:-4px;
}

/* Bank cards */
.bank-mini-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.bank-mini-card {
  background:var(--glass-1);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  border-radius:14px; padding:14px 16px;
  display:flex; flex-direction:column; gap:4px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  transition:transform .2s;
}
.bank-mini-card:hover { transform:translateY(-2px) }
.bank-mini-name { font-size:.72rem; color:var(--t2); font-weight:600 }
.bank-mini-bal {
  font-family:'Cairo'; font-size:1.15rem; font-weight:900;
  color:var(--teal);
}
.bank-mini-cur { font-size:.65rem; color:var(--t3) }

/* Last transaction */
.last-tx {
  background:var(--glass-1);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  border-radius:14px; padding:14px 16px;
  display:flex; align-items:center; gap:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.last-tx-icon {
  width:42px; height:42px; border-radius:12px;
  background:var(--glass-2);
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; flex-shrink:0;
}
.last-tx-info { flex:1; min-width:0 }
.last-tx-label { font-size:.68rem; color:var(--t3); font-weight:600; letter-spacing:.3px }
.last-tx-name {
  font-size:.9rem; font-weight:700; color:var(--t1);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.last-tx-date { font-size:.72rem; color:var(--t3); margin-top:1px }
.last-tx-amount {
  font-family:'Cairo'; font-size:1rem; font-weight:900;
  color:var(--red); flex-shrink:0;
  text-align:left;
}

.skel {
  background:linear-gradient(90deg,var(--glass-1),var(--glass-2),var(--glass-1));
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:10px;
}
@keyframes shimmer { to { background-position:-200% 0 } }
@keyframes spin { to { transform:rotate(360deg) } }

/* weather badge */
#wxBadge {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  display:none;
  align-items:center; gap:6px; padding:5px 14px;
  background:rgba(0,0,0,.35); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1); border-radius:20px;
  font-size:.74rem; color:rgba(255,255,255,.7);
  pointer-events:none; white-space:nowrap; z-index:5;
}
body.theme-weather #wxBadge { display:flex }
</style>
</head>
<body>

<!-- ══ WEATHER BACKGROUND ══ -->
<div id="weatherBg">
  <div id="wSky"></div>
  <div id="wStars"></div>
  <div id="wMoon" style="opacity:0"></div>
  <div id="wSun" style="opacity:0"><div id="wRays"></div></div>
  <div id="wClouds"></div>
  <div id="wRain"></div>
  <div id="wLightning"></div>
</div>
<div id="wxBadge">⏳ جاري تحميل الطقس...</div>

<div class="page">

  <!-- Greeting -->
  <div class="greeting">
    <div class="greeting-icon">💰</div>
    <h1>أهلاً حسين 👋</h1>
    <p>مرحباً بك في حصالة — سجّل دخولك للمتابعة</p>
  </div>

  <!-- Login card -->
  <div class="login-card">
    <h2>🔐 تسجيل الدخول</h2>
    <button class="google-btn" id="googleBtn" onclick="doGoogleSignIn()">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>تسجيل الدخول بـ Google</span>
    </button>
    <div class="login-error" id="loginErr">❌ فشل تسجيل الدخول</div>

    <div class="theme-row">
      <button id="loginThemeBtn" onclick="toggleTheme()">
        <span id="loginThemeIcon">🌤️</span>
        <span id="loginThemeLabel">ثيم الطقس</span>
      </button>
    </div>
  </div>

  <!-- Preview section (below login) -->
  <div class="preview-section">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px">
      <div class="preview-title" style="margin-bottom:0">أرصدة البنوك</div>
      <div id="liveDot" style="display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;background:rgba(255,92,107,.12);border:1px solid rgba(255,92,107,.2);font-size:.7rem;color:#ff8080;transition:all .4s">
        <span style="width:6px;height:6px;border-radius:50%;background:#ff8080;display:inline-block"></span>
        <span id="liveLabel">جاري الاتصال...</span>
      </div>
    </div>
    <div class="bank-mini-grid" id="previewBanks">
      <div class="skel" style="height:70px"></div>
      <div class="skel" style="height:70px"></div>
      <div class="skel" style="height:70px"></div>
    </div>

    <div class="preview-title" style="margin-top:8px;margin-bottom:6px">آخر معاملة</div>
    <div id="previewLastTx">
      <div class="skel" style="height:64px"></div>
    </div>
  </div>

</div>

<!-- Firebase JS SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ══ Firebase init ══ */
firebase.initializeApp({
  apiKey: "AIzaSyAYIHdr4WTES5tQ1FBZD3R9hToqky90-O4",
  authDomain: "fir-4741b.firebaseapp.com",
  projectId: "fir-4741b",
  storageBucket: "fir-4741b.firebasestorage.app",
  messagingSenderId: "520028809369",
  appId: "1:520028809369:web:551d2adf1c02c7aceeb008"
});

/* ══ helpers ══ */
const _GOOGLE_SVG = `<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;

function _showLoginError(msg) {
  const err = document.getElementById('loginErr');
  err.textContent = '❌ ' + (msg || 'فشل تسجيل الدخول');
  err.style.display = 'block';
  const btn = document.getElementById('googleBtn');
  btn.disabled = false;
  btn.innerHTML = _GOOGLE_SVG + '<span>تسجيل الدخول بـ Google</span>';
}

function _showLoginSpinner(msg) {
  document.getElementById('loginErr').style.display = 'none';
  const btn = document.getElementById('googleBtn');
  btn.disabled = true;
  btn.innerHTML = `<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,.2);border-top-color:#333;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px"></span><span>${msg || 'جاري…'}</span>`;
}

/* ══ زر تسجيل الدخول — Popup (يعمل على كل المتصفحات، لا يحتاج third-party cookies) ══ */
async function doGoogleSignIn() {
  const btn = document.getElementById('googleBtn');
  if (btn.disabled) return;
  _showLoginSpinner('جاري فتح نافذة Google…');
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    let credential;
    try {
      // Popup — الطريقة الأسرع والأكثر موثوقية
      credential = await firebase.auth().signInWithPopup(provider);
    } catch (popupErr) {
      // لو الـ popup اتحجب من المتصفح، نرجع للـ redirect
      if (popupErr.code === 'auth/popup-blocked' || popupErr.code === 'auth/popup-closed-by-user') {
        if (popupErr.code === 'auth/popup-closed-by-user') {
          _showLoginError('أغلقت نافذة تسجيل الدخول — حاول مجدداً');
          return;
        }
        // popup blocked → fallback to redirect
        _showLoginSpinner('جاري التوجيه إلى Google…');
        sessionStorage.setItem('gsignin_pending', '1');
        await firebase.auth().signInWithRedirect(provider);
        return; // الصفحة ستُحمَّل من جديد
      }
      if (popupErr.code === 'auth/unauthorized-domain') {
        _showLoginError('الدومين غير مُصرَّح في Firebase Console — أضف: ' + location.hostname);
        return;
      }
      throw popupErr;
    }

    if (!credential || !credential.user) {
      _showLoginError('لم يتم التعرف على الحساب — حاول مجدداً');
      return;
    }

    _showLoginSpinner('جاري تسجيل الدخول…');
    const idToken = await credential.user.getIdToken(true);
    const res = await fetch('/api/auth/google', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken })
    });
    const data = await res.json();
    firebase.auth().signOut().catch(() => {});
    if (data.ok) {
      window.location.replace('/');
    } else {
      _showLoginError(data.error || 'تعذّر التحقق من الحساب');
    }
  } catch(err) {
    console.error('[Auth] error:', err);
    _showLoginError('خطأ: ' + (err.message || err.code || err));
  }
}

/* ══ معالجة redirect fallback عند العودة من Google ══ */
(async function initAuth() {
  const pending = sessionStorage.getItem('gsignin_pending');
  if (!pending) return; // لا يوجد redirect جاري
  sessionStorage.removeItem('gsignin_pending');
  _showLoginSpinner('جاري التحقق…');
  try {
    const result = await firebase.auth().getRedirectResult();
    if (result && result.user) {
      const idToken = await result.user.getIdToken(true);
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken })
      });
      const data = await res.json();
      firebase.auth().signOut().catch(() => {});
      if (data.ok) { window.location.replace('/'); return; }
      _showLoginError(data.error || 'تعذّر التحقق من الحساب');
    } else {
      _showLoginError('لم يتم التعرف على الحساب — حاول مجدداً');
    }
  } catch(e) {
    if (e.code === 'auth/unauthorized-domain') {
      _showLoginError('الدومين غير مُصرَّح في Firebase Console — أضف: ' + location.hostname);
    } else {
      _showLoginError('خطأ في تسجيل الدخول: ' + (e.message || e.code || e));
    }
  }
})();

/* ══ Render preview from data ══ */
function renderPreview(data) {
  const { banks, last_tx } = data;

  /* Bank balances */
  const banksEl = document.getElementById('previewBanks');
  if (banks && banks.length) {
    banksEl.innerHTML = banks.map(b => `
      <div class="bank-mini-card">
        <div class="bank-mini-name">🏦 ${b.bank_name || 'بنك'}</div>
        <div class="bank-mini-bal">${parseFloat(b.balance || 0).toFixed(3)}</div>
        <div class="bank-mini-cur">${b.currency || 'ر.ع'}</div>
      </div>`).join('');
  } else {
    banksEl.innerHTML = '<div style="font-size:.8rem;color:var(--t3);text-align:center;padding:14px">لا توجد أرصدة مسجّلة</div>';
  }

  /* Last transaction */
  const lastEl = document.getElementById('previewLastTx');
  if (last_tx) {
    const icon = CAT_ICONS[last_tx.category] || '💳';
    lastEl.innerHTML = `
      <div class="last-tx">
        <div class="last-tx-icon">${icon}</div>
        <div class="last-tx-info">
          <div class="last-tx-label">آخر معاملة</div>
          <div class="last-tx-name">${last_tx.name}</div>
          <div class="last-tx-date">${last_tx.date}${last_tx.bank_name ? ' · ' + last_tx.bank_name : ''}</div>
        </div>

    lastEl.innerHTML = '<div style="font-size:.8rem;color:var(--t3);text-align:center;padding:14px">لا توجد معاملات بعد</div>';

/* ══ Flash animation on update ══ */
function _flashUpdate(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.style.transition = 'opacity .15s';
  el.style.opacity = '0.3';
  setTimeout(() => { el.style.opacity = '1'; }, 160);
}

/* ══ Fetch & render preview ══ */
let _previewLoading = false;
async function loadPreview(flash = false) {
  if (_previewLoading) return;
  _previewLoading = true;
  try {
    const r = await fetch('/api/login-preview');
    if (!r.ok) throw new Error('fetch failed');
    const data = await r.json();
    if (flash) { _flashUpdate('previewBanks'); _flashUpdate('previewLastTx'); }
    renderPreview(data);
  } catch(e) {
    console.warn('Preview load failed', e);
  } finally {
    _previewLoading = false;
  }
}

/* ══ SSE — real-time updates ══ */
let _previewSse = null;
let _previewRetries = 0;

function connectPreviewSSE() {
  if (_previewSse) { try { _previewSse.close(); } catch(e){} }
  _previewSse = new EventSource('/api/preview-stream');

  _previewSse.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'connected') {
        _previewRetries = 0;
        setLiveStatus(true);
      }
    } catch(err) {}
  };

  _previewSse.addEventListener('data_changed', () => {
    loadPreview(true);   // flash then re-render
  });

  _previewSse.addEventListener('reconnect', () => {
    setTimeout(connectPreviewSSE, 500);
  });

  _previewSse.onerror = () => {
    setLiveStatus(false);
    try { _previewSse.close(); } catch(e){}
    const delay = Math.min(3000 * Math.pow(2, _previewRetries), 30000);
    _previewRetries++;
    setTimeout(connectPreviewSSE, delay);
  };
}

function setLiveStatus(connected) {
  const dot  = document.getElementById('liveDot');
  const label = document.getElementById('liveLabel');
  if (!dot) return;
  if (connected) {
    dot.style.background   = 'rgba(14,201,176,.12)';
    dot.style.border       = '1px solid rgba(14,201,176,.3)';
    dot.style.color        = 'var(--teal)';
    dot.querySelector('span').style.background = 'var(--teal)';
    label.textContent = 'مباشر';
  } else {
    dot.style.background   = 'rgba(255,92,107,.12)';
    dot.style.border       = '1px solid rgba(255,92,107,.2)';
    dot.style.color        = '#ff8080';
    dot.querySelector('span').style.background = '#ff8080';
    label.textContent = 'غير متصل';
  }
}

/* ══ Weather & Theme (نفس كود index.html) ══ */
let _weatherThemeActive = false;
let _lastWeather = null;

function toggleTheme() {
  _weatherThemeActive = !_weatherThemeActive;
  const icon  = document.getElementById('loginThemeIcon');
  const label = document.getElementById('loginThemeLabel');
  if (_weatherThemeActive) {
    document.body.classList.add('theme-weather');
    icon.textContent  = '🌿';
    label.textContent = 'الثيم الأصلي';
    if (_lastWeather) applyWeatherScene(_lastWeather);
    else fetchWeatherAndApply();
  } else {
    document.body.classList.remove('theme-weather');
    icon.textContent  = '🌤️';
    label.textContent = 'ثيم الطقس';
    _restoreDefaultColors();
  }
  localStorage.setItem('theme', _weatherThemeActive ? 'weather' : 'default');
}

const WX = {
  0:['صحو','☀️',false,false,false], 1:['غائم جزئياً','🌤️',false,true,false],
  2:['غائم','⛅',false,true,false], 3:['غائم كثيف','☁️',false,true,false],
  45:['ضبابي','🌫️',false,true,false], 48:['ضبابي','🌫️',false,true,false],
  51:['رذاذ خفيف','🌦️',true,true,false], 53:['رذاذ','🌦️',true,true,false],
  55:['رذاذ كثيف','🌧️',true,true,false], 61:['مطر خفيف','🌧️',true,true,false],
  63:['مطر','🌧️',true,true,false], 65:['مطر غزير','🌧️',true,true,false],
  80:['زخات مطر','🌦️',true,true,false], 81:['زخات مطر','🌧️',true,true,false],
  82:['زخات عنيفة','⛈️',true,true,false], 95:['عاصفة رعدية','⛈️',true,true,true],
  96:['عاصفة رعدية','⛈️',true,true,true], 99:['عاصفة رعدية','⛈️',true,true,true],
};
function getWxInfo(c){ return WX[c]||WX[Math.floor(c/10)*10]||['غير معروف','🌡️',false,false,false] }

async function fetchWeatherAndApply() {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=23.588&longitude=58.383&current=temperature_2m,weather_code,is_day&timezone=Asia/Muscat');
    const d = await r.json();
    _lastWeather = d.current;
    if (_weatherThemeActive) applyWeatherScene(_lastWeather);
    setTimeout(fetchWeatherAndApply, 30*60*1000);
  } catch {
    const hr = new Date().getHours();
    _lastWeather = { weather_code:0, is_day:(hr>=6&&hr<19)?1:0, temperature_2m:null };
    if (_weatherThemeActive) applyWeatherScene(_lastWeather);
  }
}

function applyWeatherScene(wx) {
  const { weather_code, is_day, temperature_2m } = wx;
  const [label, emoji, isRain, isCloudy, isStorm] = getWxInfo(weather_code);
  const isDay = is_day === 1;

  const sky = document.getElementById('wSky');
  if (isDay) {
    sky.style.background = (isRain||isCloudy)
      ? 'linear-gradient(180deg,#1a2535 0%,#2a3a50 100%)'
      : 'linear-gradient(180deg,#0a2a6e 0%,#1a5fa8 50%,#2e86c1 100%)';
  } else {
    sky.style.background = 'linear-gradient(180deg,#020510 0%,#060d1e 50%,#0a1428 100%)';
  }

  const sun=document.getElementById('wSun'), moon=document.getElementById('wMoon'), rays=document.getElementById('wRays');
  if (isDay && !isCloudy) {
    sun.style.opacity='1'; moon.style.opacity='0'; rays.style.opacity='1';
    if (!rays.children.length) for(let i=0;i<12;i++){const s=document.createElement('span');s.style.transform=`rotate(${i*30}deg)`;rays.appendChild(s);}
  } else if (isDay && isCloudy) {
    sun.style.opacity='0.3'; moon.style.opacity='0'; rays.style.opacity='0.2';
  } else {
    sun.style.opacity='0'; rays.style.opacity='0'; moon.style.opacity='1';
  }

  const starsEl=document.getElementById('wStars');
  starsEl.innerHTML='';
  if (!isDay) {
    for(let i=0;i<120;i++){
      const s=document.createElement('div');s.className='wStar';
      const sz=Math.random()*2.5+0.5;
      s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*60}%;width:${sz}px;height:${sz}px;--d:${(Math.random()*3+2).toFixed(1)}s;--delay:-${(Math.random()*4).toFixed(1)}s;opacity:${Math.random()*.6+.2}`;
      starsEl.appendChild(s);
    }
  }

  const cloudsEl=document.getElementById('wClouds');cloudsEl.innerHTML='';
  const cc=isCloudy?(isRain?8:5):(isDay?2:1),ca=isDay?(isRain?.25:.12):.08;
  for(let i=0;i<cc;i++){
    const c=document.createElement('div');c.className='wCloud';
    const w=120+Math.random()*200,h=40+Math.random()*50,dur=40+Math.random()*50;
    c.style.cssText=`width:${w}px;height:${h}px;top:${5+Math.random()*30}%;left:${Math.random()*80}%;--cloud-color:rgba(255,255,255,${ca+Math.random()*.05});--dur:${dur}s;--delay:-${(Math.random()*dur).toFixed(0)}s`;
    cloudsEl.appendChild(c);
  }

  const rainEl=document.getElementById('wRain');rainEl.innerHTML='';
  if(isRain){
    const drops=isStorm?200:100;
    for(let i=0;i<drops;i++){
      const d=document.createElement('div');d.className='wDrop';
      const h=10+Math.random()*20;
      d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;height:${h}px;--dur:${(.5+Math.random()*.6).toFixed(2)}s;--delay:-${(Math.random()*1.5).toFixed(2)}s;opacity:${.4+Math.random()*.4}`;
      rainEl.appendChild(d);
    }
  }

  _applyWeatherColors(isDay, isCloudy, isRain);

  const badge=document.getElementById('wxBadge');
  const temp=temperature_2m!=null?` · ${Math.round(temperature_2m)}°C`:'';
  badge.textContent=`${emoji} ${label}${temp} · مسقط`;
}

const _WX_COLORS = {
  'day-clear': {
    t1:'#ffffff', t2:'#bde0ff', t3:'#80bfee',
    'glass-1':'rgba(10,50,120,.28)', 'glass-2':'rgba(10,50,120,.40)',
    'glass-border':'rgba(255,255,255,.18)', 'glass-teal':'rgba(14,201,176,.14)',
  },
  'day-cloud': {
    t1:'#eef6ff', t2:'#a8c8d8', t3:'#6898b0',
    'glass-1':'rgba(255,255,255,.07)', 'glass-2':'rgba(255,255,255,.10)',
    'glass-border':'rgba(255,255,255,.10)', 'glass-teal':'rgba(14,201,176,.08)',
  },
  'night': {
    t1:'#f0f6f2', t2:'#9ab8b2', t3:'#5c8880',
    'glass-1':'rgba(255,255,255,.04)', 'glass-2':'rgba(255,255,255,.07)',
    'glass-border':'rgba(255,255,255,.07)', 'glass-teal':'rgba(14,201,176,.06)',
  },
};
const _WX_DEFAULTS = {
  t1:'#e8f4f2', t2:'#7a9998', t3:'#3d5c5a',
  'glass-1':'rgba(255,255,255,.045)', 'glass-2':'rgba(255,255,255,.07)',
  'glass-border':'rgba(255,255,255,.08)', 'glass-teal':'rgba(14,201,176,.06)',
};
function _applyWeatherColors(isDay, isCloudy, isRain) {
  const key = !isDay ? 'night' : (isCloudy||isRain) ? 'day-cloud' : 'day-clear';
  const root = document.documentElement;
  Object.entries(_WX_COLORS[key]).forEach(([k,v]) => root.style.setProperty('--'+k, v));
  document.body.setAttribute('data-wx', key);
}
function _restoreDefaultColors() {
  const root = document.documentElement;
  Object.keys(_WX_DEFAULTS).forEach(k => root.style.removeProperty('--'+k));
  document.body.removeAttribute('data-wx');
}

/* ══ Init ══ */
(function(){
  if(localStorage.getItem('theme')==='weather'){
    _weatherThemeActive=true;
    document.body.classList.add('theme-weather');
    document.getElementById('loginThemeIcon').textContent='🌿';
    document.getElementById('loginThemeLabel').textContent='الثيم الأصلي';
  }
  fetchWeatherAndApply();
  loadPreview();          // تحميل أولي
  connectPreviewSSE();    // اتصال SSE للتحديثات اللحظية
})();
</script>
